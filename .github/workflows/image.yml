name: PyWorker image
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [deployment/Dockerfile, .github/workflows/image.yml]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free image build disk
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: ghcr.io/bi1101/ielts-qwen3-tts-worker:omni-0.30.0-sdk-1.9.1
